<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Investment Agent Pro — Акции, фьючерсы и аналитика MOEX</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a1f2e 0%, #162032 100%); border-bottom: 1px solid #21262d; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
.header .logo { font-size: 24px; }
.header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(90deg, #58a6ff, #3fb950); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .badge { background: #238636; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
.layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 61px); }
.sidebar { background: #11161d; border-right: 1px solid #21262d; display: flex; flex-direction: column; overflow-y: auto; }
.hero-panel { background: linear-gradient(135deg, rgba(31,111,235,.18), rgba(35,134,54,.12)); border:1px solid #2b3440; border-radius:14px; padding:16px; margin-bottom:12px; }
.hero-panel h2{ font-size:18px; margin-bottom:8px; }
.hero-panel p{ color:#9fb0c3; font-size:13px; line-height:1.6; }
.section-sub{ color:#8b949e; font-size:11px; margin-top:6px; line-height:1.5; }
.market-chip{ display:inline-flex; align-items:center; gap:6px; background:#0d1117; border:1px solid #30363d; border-radius:999px; padding:5px 10px; font-size:11px; color:#cdd9e5; margin: 0 6px 6px 0;}
.futures-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.futures-card{ background:#0d1117; border:1px solid #2a3139; border-radius:10px; padding:10px; }
.futures-card strong{ display:block; color:#e6edf3; font-size:12px; margin-bottom:4px; }
.futures-card span{ font-size:11px; color:#8b949e; line-height:1.4; }
.analysis-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:12px; }
.analysis-item{ background:#0d1117; border:1px solid #21262d; border-radius:10px; padding:14px; }
.analysis-item h4{ font-size:12px; color:#58a6ff; margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
.analysis-item p{ font-size:13px; color:#cdd9e5; line-height:1.6;}
.kbd{ display:inline-block; background:#21262d; border:1px solid #30363d; border-radius:6px; padding:2px 6px; font-size:11px; color:#8b949e; }
.sidebar-section { padding: 16px; border-bottom: 1px solid #21262d; }
.sidebar-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #8b949e; margin-bottom: 12px; }
.api-input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px; color: #e6edf3; font-size: 12px; margin-bottom: 8px; }
.api-input:focus { outline: none; border-color: #58a6ff; }
.btn { width: 100%; padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
.btn-primary { background: #238636; color: #fff; }
.btn-primary:hover { background: #2ea043; }
.btn-secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; margin-top: 6px; }
.btn-secondary:hover { background: #30363d; }
.ticker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ticker-btn { padding: 6px 8px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; }
.ticker-btn:hover, .ticker-btn.active { background: #1f6feb; border-color: #58a6ff; }
.quick-btn { padding: 7px 10px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #cdd9e5; font-size: 12px; cursor: pointer; transition: all 0.2s; text-align: left; width: 100%; margin-bottom: 5px; }
.quick-btn:hover { background: #30363d; border-color: #58a6ff; color: #58a6ff; }
.main { display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; background: #161b22; border-bottom: 1px solid #21262d; padding: 0 16px; }
.tab { padding: 12px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; color: #8b949e; transition: all 0.2s; }
.tab.active { color: #e6edf3; border-bottom-color: #58a6ff; }
.tab:hover { color: #e6edf3; }
.tab-content { display: none; flex: 1; overflow-y: auto; padding: 20px; }
.tab-content.active { display: flex; flex-direction: column; }
.chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; min-height: 0; }
.message { display: flex; gap: 12px; max-width: 90%; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.msg-avatar.ai { background: linear-gradient(135deg, #1f6feb, #238636); }
.msg-avatar.user { background: #30363d; }
.msg-bubble { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 12px 16px; font-size: 14px; line-height: 1.6; }
.message.user .msg-bubble { background: #1f3a5f; border-color: #1f6feb; }
.msg-bubble strong { color: #58a6ff; }
.msg-bubble .tag { display: inline-block; background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #8b949e; margin: 2px; }
.chat-input-area { display: flex; gap: 8px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 12px; }
.chat-input { flex: 1; background: none; border: none; color: #e6edf3; font-size: 14px; resize: none; outline: none; max-height: 120px; }
.send-btn { background: #1f6feb; border: none; border-radius: 8px; color: #fff; padding: 8px 16px; cursor: pointer; font-size: 16px; transition: all 0.2s; align-self: flex-end; }
.send-btn:hover { background: #388bfd; }
.send-btn:disabled { background: #21262d; cursor: not-allowed; }
.card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card h3 { font-size: 14px; color: #8b949e; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.metric { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 12px; }
.metric .label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
.metric .value { font-size: 20px; font-weight: 700; }
.metric .change { font-size: 12px; margin-top: 2px; }
.green { color: #3fb950; }
.red { color: #f85149; }
.yellow { color: #e3b341; }
.blue { color: #58a6ff; }
.portfolio-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.portfolio-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid #21262d; color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase; }
.portfolio-table td { padding: 10px; border-bottom: 1px solid #21262d; }
.portfolio-table tr:hover td { background: #1c2128; }
.news-item { padding: 12px 0; border-bottom: 1px solid #21262d; cursor: pointer; }
.news-item:last-child { border-bottom: none; }
.news-item:hover .news-title { color: #58a6ff; }
.news-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; transition: color 0.2s; }
.news-meta { font-size: 11px; color: #8b949e; display: flex; gap: 12px; }
.sentiment { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.sentiment.pos { background: rgba(63,185,80,0.15); color: #3fb950; }
.sentiment.neg { background: rgba(248,81,73,0.15); color: #f85149; }
.sentiment.neu { background: rgba(139,148,158,0.15); color: #8b949e; }
.loader { display: inline-block; width: 16px; height: 16px; border: 2px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.status-bar { padding: 6px 16px; background: #161b22; border-top: 1px solid #21262d; font-size: 11px; color: #8b949e; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #3fb950; }
.alert-box { background: rgba(31,111,235,0.1); border: 1px solid #1f6feb; border-radius: 8px; padding: 12px 16px; font-size: 13px; margin-bottom: 12px; }
.alert-box.warn { background: rgba(227,179,65,0.1); border-color: #e3b341; }
.intro-msg { text-align: center; padding: 40px 20px; }
.intro-msg h2 { font-size: 22px; margin-bottom: 10px; background: linear-gradient(90deg, #58a6ff, #3fb950); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.intro-msg p { color: #8b949e; font-size: 14px; line-height: 1.6; max-width: 500px; margin: 0 auto 20px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip
