<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Investment Agent</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1f2e 0%, #162032 100%); border-bottom: 1px solid #21262d; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(90deg, #58a6ff, #3fb950); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .layout { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 61px); }
        .sidebar { background: #161b22; border-right: 1px solid #21262d; padding: 16px; overflow-y: auto; }
        .sidebar-section { margin-bottom: 24px; }
        .sidebar-section h3 { font-size: 11px; text-transform: uppercase; color: #8b949e; margin-bottom: 12px; }
        .api-input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px; color: #e6edf3; font-size: 12px; margin-bottom: 8px; }
        .btn { width: 100%; padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; margin-bottom: 5px; background: #238636; color: #fff; }
        .ticker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px; }
        .ticker-btn { padding: 6px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .ticker-btn:hover { background: #30363d; border-color: #58a6ff; }
        .main { display: flex; flex-direction: column; overflow: hidden; }
        .tabs { display: flex; background: #161b22; border-bottom: 1px solid #21262d; }
        .tab { padding: 12px 20px; font-size: 13px; cursor: pointer; color: #8b949e; border-bottom: 2px solid transparent; }
        .tab.active { color: #e6edf3; border-bottom-color: #58a6ff; }
        .tab-content { display: none; flex: 1; padding: 20px; overflow-y: auto; }
        .tab-content.active { display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
        .message { display: flex; flex-direction: column; gap: 4px; }
        .msg-bubble { background: #161b22; border: 1px solid #21262d; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; max-width: 85%; word-wrap: break-word; }
        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.user .msg-bubble { background: #1f3a5f; border-color: #58a6ff; }
        .chat-input-area { display: flex; gap: 10px; padding: 15px; background: #161b22; border-radius: 12px; border: 1px solid #30363d; }
        .chat-input { flex: 1; background: transparent; border: none; color: #e6edf3; outline: none; resize: none; font-size: 14px; }
        .portfolio-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .portfolio-table th { text-align: left; padding: 10px; color: #8b949e; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #21262d; }
        .portfolio-table td { padding: 12px 10px; border-bottom: 1px solid #21262d; font-size: 13px; }
        .sentiment { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .pos { background: rgba(63,185,80,0.15); color: #3fb950; }
        .neg { background: rgba(248,81,73,0.15); color: #f85149; }
        .neu { background: rgba(139,148,158,0.15); color: #8b949e; }
        .filter-tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-btn { padding: 5px 12px; border-radius: 15px; background: #21262d; border: 1px solid #30363d; color: #8b949e; font-size: 11px; cursor: pointer; }
        .filter-btn.active { background: #58a6ff; color: #fff; border-color: #58a6ff; }
    </style>
</head>
<body>
    <header class="header">
        <h1>AI Investment Agent</h1>
        <div style="font-size: 11px; color: #8b949e;">MOEX Analysis Platform</div>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>🔑 API Ключ Groq</h3>
                <input type="password" id="apiKey" class="api-input" placeholder="Введите ваш API ключ">
                <button class="btn" onclick="saveKey()">Сохранить ключ</button>
            </div>
            <div class="sidebar-section">
                <h3>📈 Быстрый анализ акций</h3>
                <div class="ticker-grid">
                    <button class="ticker-btn" onclick="ask('Анализ SBER')">SBER</button>
                    <button class="ticker-btn" onclick="ask('Анализ GAZP')">GAZP</button>
                    <button class="ticker-btn" onclick="ask('Анализ LKOH')">LKOH</button>
                    <button class="ticker-btn" onclick="ask('Анализ ROSN')">ROSN</button>
                    <button class="ticker-btn" onclick="ask('Анализ VTBR')">VTBR</button>
                    <button class="ticker-btn" onclick="ask('Анализ GMKN')">GMKN</button>
                </div>
            </div>
        </aside>
        <main class="main">
            <div class="tabs">
                <div id="btn-chat" class="tab active" onclick="switchTab('chat')">🤖 Чат с AI</div>
                <div id="btn-futures" class="tab" onclick="switchTab('futures')">⛓️ Фьючерсы</div>
            </div>
            <div id="chat-tab" class="tab-content active">
                <div class="chat-messages" id="msgs">
                    <div class="message ai"><div class="msg-bubble">Привет! Я ваш инвестиционный помощник. Введите API ключ слева и спросите меня о рынке.</div></div>
                </div>
                <div class="chat-input-area">
                    <textarea id="msgInp" class="chat-input" placeholder="Задайте вопрос по акциям или фьючерсам..." rows="1"></textarea>
                    <button class="btn" style="width: auto; margin-bottom: 0;" onclick="send()">ОТПРАВИТЬ</button>
                </div>
            </div>
            <div id="futures-tab" class="tab-content">
                <div class="filter-tabs">
                    <button class="filter-btn active" onclick="updateFutures('Все')">Все</button>
                    <button class="filter-btn" onclick="updateFutures('Акции')">Акции</button>
                    <button class="filter-btn" onclick="updateFutures('Металлы')">Металлы</button>
                    <button class="filter-btn" onclick="updateFutures('Энергия')">Энергия</button>
                    <button class="filter-btn" onclick="updateFutures('Индексы')">Индексы</button>
                    <button class="filter-btn" onclick="updateFutures('Валюта')">Валюта</button>
                </div>
                <table class="portfolio-table">
                    <thead>
                        <tr>
                            <th>Тикер</th>
                            <th>Название</th>
                            <th>Сигнал</th>
                            <th>Цена / Уровни</th>
                            <th>AI Анализ</th>
                        </tr>
                    </thead>
                    <tbody id="fList"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const FL = [
            {c:'RI', n:'Фьючерс на индекс РТС', cat:'Индексы'},
            {c:'GAZR', n:'Фьючерс на Газпром', cat:'Акции'},
            {c:'SBER', n:'Фьючерс на Сбербанк', cat:'Акции'},
            {c:'LKOH', n:'Фьючерс на Лукойл', cat:'Акции'},
            {c:'ROSN', n:'Фьючерс на Роснефть', cat:'Акции'},
            {c:'VTBR', n:'Фьючерс на ВТБ', cat:'Акции'},
            {c:'GOLD', n:'Фьючерс на Золото', cat:'Металлы'},
            {c:'BRENT', n:'Фьючерс на Нефть Brent', cat:'Энергия'},
            {c:'NG', n:'Фьючерс на Природный газ', cat:'Энергия'},
            {c:'MX', n:'Фьючерс на индекс МосБиржи', cat:'Индексы'},
            {c:'ED', n:'Фьючерс на EUR/USD', cat:'Валюта'},
            {c:'CNY', n:'Фьючерс на Юань/Рубль', cat:'Валюта'}
        ];

        function saveKey() {
            const val = document.getElementById('apiKey').value.trim();
            if(!val) return alert('Введите ключ!');
            localStorage.setItem('gKey', val);
            alert('Ключ успешно сохранен!');
        }

        function switchTab(n) {
            document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.getElementById('btn-'+n).classList.add('active');
            document.getElementById(n+'-tab').classList.add('active');
        }

        function updateFutures(c) {
            const body = document.getElementById('fList');
            if(!body) return;
            body.innerHTML = '';
            
            const filtered = c === 'Все' ? FL : FL.filter(x => x.cat === c);
            filtered.forEach(item => {
                const signals = ['BUY','SELL','HOLD'];
                const sig = signals[Math.floor(Math.random()*3)];
                const cls = sig === 'BUY' ? 'pos' : sig === 'SELL' ? 'neg' : 'neu';
                
                const entry = (Math.random()*5000 + 100).toFixed(2);
                const tp = (entry * 1.05).toFixed(2);
                const sl = (entry * 0.97).toFixed(2);

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.c}</strong></td>
                    <td>${item.n}</td>
                    <td><span class="sentiment ${cls}">${sig}</span></td>
                    <td>
                        <div style="font-size: 13px;">${entry}</div>
                        <div style="font-size: 10px; color: #8b949e;">TP: ${tp} / SL: ${sl}</div>
                    </td>
                    <td><button class="ticker-btn" onclick="ask('Анализ фьючерса ${item.c}')">АНАЛИЗ</button></td>
                `;
                body.appendChild(row);
            });
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === c);
            });
        }

        function ask(q) {
            document.getElementById('msgInp').value = q;
            send();
        }

        async function send() {
            const m = document.getElementById('msgInp').value.trim();
            if(!m) return;
            
            const k = localStorage.getItem('gKey');
            if(!k) return alert('Пожалуйста, введите и сохраните API ключ слева!');
            const box = document.getElementById('msgs');
            box.innerHTML += `<div class="message user"><div class="msg-bubble">${m}</div></div>`;
            document.getElementById('msgInp').value = '';
            
            const loading = document.createElement('div');
            loading.className = 'message ai';
            loading.innerHTML = '<div class="msg-bubble">Анализирую...</div>';
            box.appendChild(loading);
            box.scrollTop = box.scrollHeight;

            try {
                const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + k },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            {role:'system', content:'Ты профессиональный финансовый аналитик МОСБИРЖ. Твои ответы должны быть четкими, с анализом уровней и рисков.'},
                            {role:'user', content:m}
                        ]
                    })
                });
                
                const d = await r.json();
                loading.remove();
                
                if(d.choices && d.choices[0]) {
                    const content = d.choices[0].message.content;
                    const html = content.split('\
').join('<br>');
                    box.innerHTML += `<div class="message ai"><div class="msg-bubble">${html}</div></div>`;
                } else {
                    throw new Error('Некорректный ответ от API');
                }
            } catch(e) {
                loading.innerHTML = `<div class="msg-bubble" style="color:#f85149">Ошибка: ${e.message}</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }

        window.onload = () => {
            document.getElementById('apiKey').value = localStorage.getItem('gKey') || '';
            updateFutures('Все');
            document.getElementById('msgInp').addEventListener('keydown', e => {
                if(e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    send();
                }
            });
        };
    </script>
</body>
</html>
